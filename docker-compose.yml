version: "3.9"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.4
    container_name: aether-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 512M
      - --overprovisioned
    ports:
      - "19092:19092"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi-mlops:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: aether-fastapi
    environment:
      - REDPANDA_BROKERS=redpanda:9092
      - DUCKDB_PATH=/app/data/lakehouse/aether_dc.duckdb
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aether-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - fastapi-mlops

  streamlit-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: aether-dashboard
    environment:
      - API_BASE_URL=http://fastapi-mlops:8000
      - DUCKDB_PATH=/app/data/lakehouse/aether_dc.duckdb
      - REDPANDA_BROKERS=redpanda:9092
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-mlops
